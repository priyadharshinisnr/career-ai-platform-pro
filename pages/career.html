<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Career Recommendation</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<section class="career-recommendation">

    <h1>🎯 Career Recommendation</h1>

    <p>
        Select your skills and discover suitable career paths.
    </p>


    <label>Enter Your Skills</label>

    <textarea
        id="careerSkills"
        placeholder="Example: Python, SQL, Machine Learning"
    ></textarea>


    <button onclick="recommendCareer()">
        Recommend Career
    </button>


    <div id="careerResult"></div>

</section>


<script src="../script.js"></script>

</body>

</html>
